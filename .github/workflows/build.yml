name: build

on:
  push:
    branches: [main]
  # Build and check PRs, never publish them, so a dependency bump fails
  # before merge rather than on the run that publishes :latest.
  pull_request:
    branches: [main]
  # Weekly rebuild for Ubuntu security updates: exe.dev VMs have apt-daily
  # masked, so patches land by recreating or rebasing onto a new image.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialise publishes so the newest merge ends up on :latest; overlapping
# builds otherwise finish in any order (observed with five merges at once).
# Only PR builds are cancelled: on main, cancelling could abandon a build that
# already published its immutable tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lint every Dockerfile (the action expands **/Dockerfile*, and fails
      # if nothing matches). Ignored rules and why: .hadolint.yaml.
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile*
          recursive: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Use Docker's image store, so derived images resolve the local base
          # and the publish step pushes what was built.
          driver: docker
          name: default

      # Only main publishes: PRs from forks get a read-only token, and other
      # branches must not push unmerged code to :latest.
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # exe.dev caches mutable tags, so each build also gets an immutable id
      # to pin: <date>.<run_number>.<run_attempt>. Date or sha alone repeat
      # (same-day builds, the weekly rebuild), and run_number repeats on
      # re-runs; run_attempt does not.
      - id: tag
        run: |
          # One clock read, so a run crossing midnight cannot tag two days.
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "build=${now%%T*}.${{ github.run_number }}.${{ github.run_attempt }}"
            echo "created=$now"
          } >> "$GITHUB_OUTPUT"

      # Built once and loaded: the checks run on this image and the publish
      # step pushes it. BUILD_ID overrides ubuntu's "24.04" version label;
      # static labels are in the Dockerfile. Every build here disables
      # provenance/SBOM: their manifest list can hide the metadata exe.dev
      # reads (Cmd, Labels, ExposedPorts).
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            BUILD_ID=${{ steps.tag.outputs.build }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tag.outputs.created }}
          tags: ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }}
          provenance: false
          sbom: false

      # Unbooted: exe.dev's metadata, load-bearing build steps, and the svc-
      # profile via the image's own systemd-analyze on the hello unit
      # (threshold 20 = exposure 2.0; a unit the drop-in misses scores ~9.4).
      # Booted: hello on this base, with its own labels, under systemd. See
      # docs/developing.md#validating-the-hardening-profile.
      - name: Check the image
        run: |
          set -euo pipefail
          docker build --builder default --provenance=false --sbom=false \
            --build-arg BASE=ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }} \
            --label org.opencontainers.image.title=exeslim-hello \
            --label "org.opencontainers.image.description=The hello example service from exeslim's examples/hello, on the exeslim base image." \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.created=${{ steps.tag.outputs.created }} \
            -t ghcr.io/tho/exeslim-hello:${{ steps.tag.outputs.build }} examples/hello

          # What exe.dev reads: proxy port, login user, version label.
          meta=$(docker inspect ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }} --format \
            '{{json .Config.ExposedPorts}} {{index .Config.Labels "exe.dev/login-user"}} {{index .Config.Labels "org.opencontainers.image.version"}}')
          [[ $meta == '{"8000/tcp":{}} exedev ${{ steps.tag.outputs.build }}' ]] ||
            { echo "image metadata is wrong: $meta"; exit 1; }
          # machine-id is emptied after the last apt layer (packages write
          # one). The /tmp override must match Ubuntu's file name to shadow
          # its wipe-at-boot D line.
          docker run --rm ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }} bash -euc '
            [[ ! -s /etc/machine-id && $(readlink /var/lib/dbus/machine-id) == /etc/machine-id ]]
            touch /tmp/keep && systemd-tmpfiles --remove && test -e /tmp/keep'

          docker run --rm ghcr.io/tho/exeslim-hello:${{ steps.tag.outputs.build }} bash -euc '
            systemd-analyze verify svc-hello.service
            systemd-analyze security --offline=true --threshold=20 svc-hello.service'

          docker run -d --name hello --privileged --tmpfs /run --tmpfs /run/lock ghcr.io/tho/exeslim-hello:${{ steps.tag.outputs.build }}
          # "degraded" is expected: systemd-growfs-root fails in Docker.
          timeout 120 bash -c 'until [[ $(docker exec hello systemctl is-system-running 2>/dev/null) =~ ^(running|degraded)$ ]]; do sleep 1; done'
          failed=$(docker exec hello systemctl --failed --plain --no-legend | awk '{print $1}')
          [[ -z $failed || $failed == systemd-growfs-root.service ]] ||
            { echo "unexpected failed units: $failed"; exit 1; }
          # Unix-socket peer auth needs nss-systemd to resolve the dynamic user.
          [[ $(docker exec hello getent passwd svc-hello | cut -d: -f1) == svc-hello ]] ||
            { echo "nss-systemd does not resolve svc-hello"; exit 1; }
          # init's low-port sysctl; its guard would skip a misspelt key
          # silently. IPv6 only where the runner has it.
          for key in ipv4/ip_unprivileged_port_start ipv6/ip_unprivileged_port_start; do
            [[ $key == ipv6/* ]] && ! docker exec hello test -e "/proc/sys/net/$key" && continue
            [[ $(docker exec hello cat "/proc/sys/net/$key") == 0 ]] ||
              { echo "init's sysctl net/$key is not 0"; exit 1; }
          done
          docker exec hello curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/

      # The variants, on this run's base (full on Shelley), loaded for the
      # checks and the publish step. Their Dockerfiles override the
      # descriptive labels; the rest are inherited.
      - name: Build the Shelley variant
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.shelley
          platforms: linux/amd64
          load: true
          build-args: |
            BASE=ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }}
          tags: ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }}-shelley
          provenance: false
          sbom: false

      - name: Build the Shelley full variant
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.shelley-full
          platforms: linux/amd64
          load: true
          build-args: |
            BASE=ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }}-shelley
          tags: ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }}-shelley-full
          provenance: false
          sbom: false

      # Unbooted: metadata, the enabled socket (the label only installs the
      # binary) and tools; the full variant's extra tools. Booted (full):
      # the socket listens on 9999 and ~/.config/shelley as exedev, and
      # image/shelley-guard.nft refuses a DynamicUser= process.
      - name: Check the Shelley variants
        run: |
          set -euo pipefail
          base=$(docker inspect ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }} --format '{{index .Config.Labels "exe.dev/install-shelley"}}')
          [[ $base != true ]] || { echo "base image has exe.dev/install-shelley=true"; exit 1; }
          for v in shelley shelley-full; do
            img=ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }}-$v
            meta=$(docker inspect "$img" --format \
              '{{json .Config.ExposedPorts}} {{index .Config.Labels "exe.dev/login-user"}} {{index .Config.Labels "exe.dev/install-shelley"}} {{index .Config.Labels "org.opencontainers.image.version"}} {{index .Config.Labels "org.opencontainers.image.title"}}')
            [[ $meta == "{\"8000/tcp\":{},\"9999/tcp\":{}} exedev true ${{ steps.tag.outputs.build }} exeslim-$v" ]] ||
              { echo "$v metadata is wrong: $meta"; exit 1; }
            # Their apt layers can rewrite the machine-id the base emptied.
            docker run --rm "$img" bash -euc '
              test -L /etc/systemd/system/sockets.target.wants/shelley.socket
              systemd-analyze verify shelley-guard.service
              test -f /etc/systemd/system/shelley.socket.d/10-guard.conf
              [[ ! -s /etc/machine-id ]]
              for b in jq sqlite3 lsof; do command -v "$b" >/dev/null || { echo "missing $b"; exit 1; }; done' ||
              { echo "$v: shelley.socket, its guard, machine-id or tools are wrong"; exit 1; }
          done

          # The guard's UID range must match systemd's build-time DynamicUser=
          # range, recorded only in systemd-dev's pkg-config file.
          guard=$(sed -n 's/.* meta skuid \([0-9]*\)-\([0-9]*\) .*/\1 \2/p' image/shelley-guard.nft)
          read -r guard_min guard_max <<<"$guard"
          [[ -n ${guard_max-} ]] || { echo "cannot read the UID range from image/shelley-guard.nft"; exit 1; }
          dynamic=$(docker run --rm ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }}-shelley bash -euc '
            cd /tmp
            apt-get update -qq
            apt-get download -qq "systemd-dev=$(dpkg-query -W -f="\${Version}" systemd)"
            dpkg-deb --fsys-tarfile systemd-dev_*.deb | tar -xO ./usr/share/pkgconfig/systemd.pc >systemd.pc
            echo "$(sed -n "s/^dynamic_uid_min=//p" systemd.pc) $(sed -n "s/^dynamic_uid_max=//p" systemd.pc)"')
          [[ $dynamic == "$guard_min $guard_max" ]] ||
            { echo "systemd allocates DynamicUser= UIDs from '$dynamic', the guard matches $guard_min-$guard_max"; exit 1; }

          docker run --rm ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }}-shelley-full bash -euc '
            for b in /headless-shell/headless-shell ffmpeg ffprobe convert git; do
              command -v "$b" >/dev/null || { echo "missing $b"; exit 1; }
            done
            ! ldd /headless-shell/headless-shell | grep "not found"
            # The Shelley version check reads this; the binary cannot say.
            grep -q "^Chromium " /headless-shell/headless-shell-version.txt
            # distrust-emudhra.sh must have applied to the exedev NSS database.
            certutil -L -d sql:/home/exedev/.pki/nssdb | grep -q "^distrusted emSign ECC Root CA - G3 *p,p,p$"
            convert -list format | grep -q HEIC
            ffmpeg -hide_banner -encoders | grep -q libx264'

          docker run -d --name shelley --privileged --tmpfs /run --tmpfs /run/lock ghcr.io/tho/exeslim:${{ steps.tag.outputs.build }}-shelley-full
          timeout 120 bash -c 'until [[ $(docker exec shelley systemctl is-system-running 2>/dev/null) =~ ^(running|degraded)$ ]]; do sleep 1; done'
          failed=$(docker exec shelley systemctl --failed --plain --no-legend | awk '{print $1}')
          [[ -z $failed || $failed == systemd-growfs-root.service ]] ||
            { echo "unexpected failed units: $failed"; exit 1; }
          [[ -n $(docker exec shelley ss -ltnH 'sport = :9999') ]] ||
            { echo "shelley.socket is not listening on 9999"; exit 1; }
          # ~/.config/shelley must stay exedev's, or Shelley cannot write it.
          sock=$(docker exec shelley stat -c '%U %F' /home/exedev/.config/shelley/shelley.sock /home/exedev/.config/shelley)
          [[ $sock == $'exedev socket\nexedev directory' ]] ||
            { echo "shelley.sock or its directory is wrong:"; echo "$sock"; exit 1; }

          # A dynamic user is refused (exit 1, not a 124 timeout) while root
          # is accepted, so the rule is what stopped it. Last: with no Shelley
          # binary, root's connection leaves the socket nothing to start.
          [[ $(docker exec shelley systemctl is-active shelley-guard.service) == active ]] ||
            { echo "shelley-guard.service is not active"; exit 1; }
          connect='timeout 3 bash -c ": </dev/tcp/127.0.0.1/9999" 2>/dev/null'
          probe=$(docker exec shelley systemd-run --quiet --wait --pipe --collect -p DynamicUser=yes \
            bash -c "id -u; $connect; echo \$?")
          uid=${probe%%$'\n'*}
          (( uid >= guard_min && uid <= guard_max )) ||
            { echo "DynamicUser= UID $uid is outside the range the guard matches"; exit 1; }
          [[ ${probe##*$'\n'} == 1 ]] ||
            { echo "a DynamicUser= process was not refused on Shelley's port (uid, exit status): $probe"; exit 1; }
          docker exec shelley bash -c "$connect" ||
            { echo "root cannot reach Shelley's port, so the check above proves nothing"; exit 1; }

      # Booted failures are otherwise mute (a boot-wait timeout just exits 124).
      - if: failure()
        name: Dump the booted container
        run: |
          for c in hello shelley; do
            docker logs "$c" 2>&1 | tail -n 100 || true
            docker exec "$c" systemctl --failed --no-pager || true
            docker exec "$c" journalctl -b --no-pager | tail -n 200 || true
          done

      # Push the checked images, main only. No :<date> or :<sha> tags: they
      # would move while looking like pins. Immutable tags go first and must
      # read back as plain image manifests (with a config) for exe.dev to see
      # the metadata; a failure there leaves every :latest unmoved.
      - name: Publish the checked images
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          build=${{ steps.tag.outputs.build }}
          # "<immutable> <moving>", under ghcr.io/tho/.
          pairs=(
            "exeslim:${build} exeslim:latest"
            "exeslim-hello:${build} exeslim-hello:latest"
            "exeslim:${build}-shelley exeslim:latest-shelley"
            "exeslim:${build}-shelley-full exeslim:latest-shelley-full"
          )
          for pair in "${pairs[@]}"; do
            read -r pinned _ <<<"$pair"
            docker push "ghcr.io/tho/$pinned"
            docker buildx imagetools inspect --raw "ghcr.io/tho/$pinned" | jq -e 'has("config")' >/dev/null ||
              { echo "ghcr.io/tho/$pinned was not pushed as a plain image manifest"; exit 1; }
          done
          for pair in "${pairs[@]}"; do
            read -r pinned moving <<<"$pair"
            docker tag "ghcr.io/tho/$pinned" "ghcr.io/tho/$moving"
            docker push "ghcr.io/tho/$moving"
          done
