# Hardening profile for every svc-<app>.service. Installed by the exeslim base
# image as /etc/systemd/system/svc-.service.d/50-hardening.conf, a prefix
# drop-in: systemd applies it to any unit whose name starts with "svc-", so a
# derived image gets it by naming its unit, without copying it.
#
# Drop-ins are read after the unit file, so for single-value keys these
# settings win over the unit file's. List keys (RestrictAddressFamilies=,
# SystemCallFilter=, ReadWritePaths= and the like) merge instead, so the unit
# file can widen them. To loosen a setting on purpose, add a drop-in under
# svc-<app>.service.d/ that sorts after 50-hardening.conf; a file of the same
# name there would replace this one. See docs/deploying.md.

[Unit]
# No start limit: a service that keeps failing (a database down, a missing
# credential) backs off below instead of being given up on after 5 starts.
StartLimitIntervalSec=0

[Service]
# Fresh UID/GID per unit, allocated at start and released at stop, never in
# /etc/passwd. Also implies ProtectSystem=strict, ProtectHome=read-only,
# PrivateTmp=, RemoveIPC=, NoNewPrivileges= and RestrictSUIDSGID=. State goes
# in StateDirectory=, owned by that UID.
DynamicUser=yes
# Implied above; stated so the setting is visible. The private /tmp (and
# /var/tmp) is a directory under the VM's own, which stays on the root
# filesystem because tmp.mount is not enabled: disk-backed (not RAM, which is
# pooled across exe.dev VMs), bounded by the ext4 root reserve, and emptied
# when the unit stops.
PrivateTmp=yes
# Whole filesystem read-only except StateDirectory=, /tmp and the like.
ProtectSystem=strict
# /home, /root and /run/user are empty and inaccessible: no reading exedev's
# keys or dotfiles. DynamicUser= alone would only make them read-only.
ProtectHome=yes
# Minimal /dev with pseudo devices only: no /dev/vda, so no raw disk reads.
PrivateDevices=yes
# Neither setuid binaries nor file capabilities can raise privileges (implied
# by DynamicUser= as well).
NoNewPrivileges=yes
# No capabilities, not even ones a later execve could pick up.
CapabilityBoundingSet=
AmbientCapabilities=
# TCP/UDP over IPv4/IPv6 only. No AF_UNIX: no dbus, no systemd private socket,
# no container runtime socket, no /dev/log. Local databases over 127.0.0.1.
# AF_NETLINK and AF_PACKET are refused too. This filters socket(2) only, so
# the stdout/stderr sockets systemd hands the service for journald still work.
RestrictAddressFamilies=AF_INET AF_INET6
# No new namespaces of any kind, user namespaces included, which closes the
# usual route to kernel attack surface for an unprivileged process.
RestrictNamespaces=yes
# Read-only /proc/sys and /sys, no module loading, no kernel log, no cgroup
# writes, no clock or hostname changes.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# Other users' processes are invisible in /proc, and /proc shows only process
# dirs: no /proc/meminfo or /proc/cpuinfo (ProcSubset=all if the app reads
# them).
ProtectProc=invisible
ProcSubset=pid
# No personality() tricks, no realtime scheduling, no writable+executable
# memory (Go binaries do not need it; JITs do, override if you run one).
LockPersonality=yes
RestrictRealtime=yes
MemoryDenyWriteExecute=yes
# Syscalls a normal service uses, minus privileged and resource-control ones.
# Anything else fails with EPERM instead of killing the process, so a blocked
# call shows up as an error in the app's own log. Native ABI only, so a
# non-native syscall cannot sidestep the filter.
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
SystemCallArchitectures=native
# Files the service creates are private to it by default.
UMask=0077
# Resource limits. Percentages are of the VM's physical memory, so one service
# per VM is the model. Over MemoryMax= the OOM killer runs inside the unit; the
# base image has exeuntu's DefaultOOMPolicy=continue, so only the killed
# process goes: the unit stays up if that was a child, and Restart= below
# brings it back if it was the main process.
MemoryMax=80%
TasksMax=512
# Half the kernel default of 100, so the other units in system.slice (journald
# among them) get twice the service's CPU share when the VM is saturated.
CPUWeight=50
# Restart on anything but a clean exit: first retry after 2s, growing to 1min
# over 10 restarts.
Restart=on-failure
RestartSec=2s
RestartSteps=10
RestartMaxDelaySec=1min
