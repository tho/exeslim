# Installed as shelley.socket.d/10-guard.conf, a drop-in so that exeuntu's
# shelley.socket stays as exeuntu has it. Fails closed: if the rule cannot be
# loaded (a kernel without nf_tables), Shelley's socket does not start, rather
# than listening where a svc-<app> unit can reach it.

[Unit]
Requires=shelley-guard.service
After=shelley-guard.service
